
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>IPL 2026 Ticket Booking</h1>

    <h2>Ticket Booking Form</h2>

    <form action="#" method="post">

        <!-- Name -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name"
               minlength="3" maxlength="30" required>
        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email"
               required>
        <br><br>

        <!-- Phone Number -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter 10 digit phone number"
               pattern="[0-9]{10}"
               title="Enter exactly 10 digits"
               required>
        <br><br>

        <!-- Match Selection -->
        <label for="match">Select Match:</label>
        <select id="match" name="match" required>
            <option value="">Choose Match</option>
            <option value="RCB vs CSK">RCB vs CSK</option>
            <option value="MI vs KKR">MI vs KKR</option>
            <option value="SRH vs RR">SRH vs RR</option>
            <option value="CSK vs MI">CSK vs MI</option>
        </select>
        <br><br>

        <!-- Stand Category -->
        <label for="stand">Stand Category:</label>
        <select id="stand" name="stand" required>
            <option value="">Choose Stand</option>
            <option value="General">General</option>
            <option value="Premium">Premium</option>
            <option value="VIP">VIP</option>
        </select>
        <br><br>

        <!-- Number of Tickets -->
        <label for="tickets">Number of Tickets:</label>
        <input type="number" id="tickets" name="tickets"
               min="1" max="10" required>
        <br><br>
                <!-- Additional Booking Preference -->
        <p>Booking Preference:</p>

        <input type="radio" id="regular" name="preference"
               value="Regular" required>
        <label for="regular">Regular Booking</label>

        <input type="radio" id="early" name="preference"
               value="Early">
        <label for="early">Early Entry</label>

        <br><br>

        <!-- Submit and Reset Buttons -->
        <button type="submit">Submit Booking</button>
        <button type="reset">Reset</button>

    </form>
    <script src="app.js"></script>


</body>
</html>
